<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotation Tracker</title>

<style>

/* ================= BASE ================= */
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  padding: 16px;
  background: radial-gradient(circle at top, #1d2a3f 0, #020617 60%, #000 100%);
  color: #f9fafb;
  display: flex;
  justify-content: center;
}

/* ================= LAYOUT ================= */
.app-shell {
  width: 100%;
  max-width: 980px;
}

.layout-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 16px;
}

@media (max-width: 800px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
}

/* ================= PANEL ================= */
.panel {
  background: #020617;
  border-radius: 24px;
  padding: 16px;
  border: 1px solid rgba(148,163,184,.25);
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.panel-title {
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9ca3af;
}

.panel-sub {
  font-size: 11px;
  color: #6b7280;
}

.sub-mode-btn {
  border-radius: 999px;
  padding: 6px 14px;
  border: 1px solid rgba(148,163,184,.6);
  background: transparent;
  color: #fff;
}

/* ================= COURT ================= */

.court-wrapper {
  border-radius: 20px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,.08);
}

.court-label {
  text-align: center;
  font-size: 10px;
  letter-spacing: .2em;
  color: #6b7280;
  margin-bottom: 8px;
}

.court {
  position: relative;
  height: 520px;
  border-radius: 18px;
  overflow: hidden;
  background:
    linear-gradient(180deg,
      rgba(89,48,20,.25),
      rgba(120,66,30,.35),
      rgba(32,23,18,.55)
    ),
    linear-gradient(180deg, #071126, #06102a);
}

/* COURT LINES */
.court-lines { position:absolute; inset:0; pointer-events:none; }

.boundary {
  position:absolute;
  inset:18px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
}

.key {
  position:absolute;
  left:50%;
  top:50px;
  transform:translateX(-50%);
  width:160px;
  height:160px;
  border:2px solid rgba(255,255,255,.15);
  border-top:none;
  border-radius:0 0 80px 80px;
}

.ft-circle {
  position:absolute;
  left:50%;
  top:120px;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border:2px solid rgba(255,255,255,.1);
  border-radius:50%;
}

.rim {
  position:absolute;
  left:50%;
  top:70px;
  transform:translateX(-50%);
  width:40px;
  height:40px;
  border:2px solid rgba(255,255,255,.2);
  border-radius:50%;
}

.backboard {
  position:absolute;
  left:50%;
  top:50px;
  transform:translateX(-50%);
  width:80px;
  border-top:2px solid rgba(255,255,255,.15);
}

.arc {
  position:absolute;
  left:50%;
  top:60px;
  transform:translateX(-50%);
  width:420px;
  height:420px;
  border:2px solid rgba(255,255,255,.1);
  border-top:none;
  border-radius:0 0 420px 420px;
  clip-path: inset(0 0 45% 0);
}

.corner-left, .corner-right {
  position:absolute;
  top:60px;
  height:160px;
  border-left:2px solid rgba(255,255,255,.1);
}
.corner-left { left:90px; }
.corner-right { right:90px; }

/* PLAYER ROWS (CRITICAL FOR YOUR JS) */
#courtTop, #courtMid, #courtBot {
  position:absolute;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
}

#courtTop { top:60px; }
#courtMid { top:220px; }
#courtBot { bottom:40px; }

/* ================= PLAYERS ================= */
.player-chip {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:999px;
  background:#020617;
  border:1px solid rgba(255,255,255,.08);
}

.number-pill {
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f97316;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.player-name { font-size:13px; font-weight:600; }
.player-role { font-size:10px; color:#9ca3af; }
.player-mins { font-size:11px; color:#cbd5f5; }

/* ================= BENCH ================= */
.bench-grid {
  margin-top: 12px;
}

.bench-card {
  padding: 10px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.1);
  margin-bottom: 6px;
}

/* ================= MINUTES ================= */
.minutes-list {
  margin-top:10px;
}

.minutes-row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

</style>
</head>

<body>

<div class="app-shell">
  <div class="layout-grid">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">On Court</div>
          <div class="panel-sub">Use ▲ / ▼ to arrange spots · Sub Mode to mark on/off</div>
        </div>
        <button class="sub-mode-btn">Sub Mode</button>
      </div>

      <div class="court-wrapper">
        <div class="court-label">Half Court</div>

        <div class="court">
          <div class="court-lines">
            <div class="boundary"></div>
            <div class="backboard"></div>
            <div class="rim"></div>
            <div class="key"></div>
            <div class="ft-circle"></div>
            <div class="arc"></div>
            <div class="corner-left"></div>
            <div class="corner-right"></div>
          </div>

          <!-- KEEP THESE -->
          <div id="courtTop"></div>
          <div id="courtMid"></div>
          <div id="courtBot"></div>
        </div>
      </div>

      <div class="bench-grid" id="benchGrid"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">
      <div class="panel-title">Player Minutes</div>
      <div class="minutes-list" id="minutesList"></div>
    </div>

  </div>
</div>

<script>

/* ================= STATE ================= */
const state = {
  onCourt: [22,72,16,94,36],
  bench: [20,90,10],
  minutes:{},
  players:{
    22:{name:"Thomas O'Sullivan",pos:"PG"},
    72:{name:"Tate Power",pos:"SG"},
    16:{name:"Archer Kenny",pos:"SF"},
    94:{name:"Rodion Prystupa",pos:"PF"},
    36:{name:"Jacob Nguyen",pos:"C"},
    20:{name:"Bill Pham",pos:"SF"},
    90:{name:"Ethan Poon",pos:"SF"},
    10:{name:"Max Payne",pos:"SG"}
  }
};

/* ================= HELPERS ================= */
function format(sec){
  const m=Math.floor(sec/60);
  const s=sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ================= RENDER ================= */
function chip(id){
  const p=state.players[id];
  const div=document.createElement("div");
  div.className="player-chip";
  div.innerHTML=`
    <div class="number-pill">${id}</div>
    <div>
      <div class="player-name">${p.name}</div>
      <div class="player-role">${p.pos}</div>
      <div class="player-mins">${format(state.minutes[id]||0)}</div>
    </div>
  `;
  return div;
}

function render(){
  const top=document.getElementById("courtTop");
  const mid=document.getElementById("courtMid");
  const bot=document.getElementById("courtBot");

  top.innerHTML="";
  mid.innerHTML="";
  bot.innerHTML="";

  state.onCourt.slice(0,2).forEach(id=>top.appendChild(chip(id)));
  state.onCourt.slice(2,4).forEach(id=>mid.appendChild(chip(id)));
  bot.appendChild(chip(state.onCourt[4]));

  const bench=document.getElementById("benchGrid");
  bench.innerHTML="";
  state.bench.forEach(id=>{
    const div=document.createElement("div");
    div.className="bench-card";
    div.textContent=state.players[id].name;
    bench.appendChild(div);
  });

  const list=document.getElementById("minutesList");
  list.innerHTML="";
  Object.keys(state.players).forEach(id=>{
    const row=document.createElement("div");
    row.className="minutes-row";
    row.innerHTML=`
      <div>${state.players[id].name}</div>
      <div>${format(state.minutes[id]||0)}</div>
    `;
    list.appendChild(row);
  });
}

/* ================= CLOCK ================= */
setInterval(()=>{
  state.onCourt.forEach(id=>{
    state.minutes[id]=(state.minutes[id]||0)+1;
  });
  render();
},1000);

/* INIT */
render();

</script>

</body>
</html>
